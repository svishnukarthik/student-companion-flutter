<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520">
  <rect width="900" height="520" fill="#0f172a"/>
  <rect x="40" y="35" width="820" height="450" rx="16" fill="#1e293b"/>
  <g font-family="Arial, sans-serif">
    <!-- setState side -->
    <rect x="70" y="65" width="370" height="400" rx="12" fill="#243248" stroke="#10b981" stroke-width="1.5"/>
    <text x="255" y="95" fill="#10b981" font-size="15" font-weight="bold" text-anchor="middle">setState() — Local State</text>
    <text x="255" y="170" fill="#fff" font-size="42" font-weight="bold" text-anchor="middle">90.0%</text>
    <text x="255" y="200" fill="#94a3b8" font-size="14" text-anchor="middle">36 / 40 classes</text>
    <rect x="110" y="230" width="130" height="38" rx="8" fill="#10b981"/>
    <text x="175" y="254" fill="#000" font-size="13" font-weight="bold" text-anchor="middle">✓ Present</text>
    <rect x="260" y="230" width="130" height="38" rx="8" fill="#ef4444"/>
    <text x="325" y="254" fill="#fff" font-size="13" font-weight="bold" text-anchor="middle">✗ Absent</text>
    <text x="255" y="310" fill="#94a3b8" font-size="12" text-anchor="middle">StatefulWidget lifecycle</text>
    <text x="255" y="330" fill="#94a3b8" font-size="12" text-anchor="middle">setState(() { _attended++; })</text>
    <text x="255" y="360" fill="#94a3b8" font-size="11" text-anchor="middle">State is local to widget tree</text>
    <!-- Provider side -->
    <rect x="470" y="65" width="370" height="400" rx="12" fill="#243248" stroke="#6366f1" stroke-width="1.5"/>
    <text x="655" y="95" fill="#6366f1" font-size="15" font-weight="bold" text-anchor="middle">Provider — Reactive State</text>
    <text x="655" y="150" fill="#10b981" font-size="14" text-anchor="middle">Attendance (Provider)</text>
    <text x="655" y="180" fill="#fff" font-size="32" font-weight="bold" text-anchor="middle">85.7%</text>
    <text x="655" y="200" fill="#94a3b8" font-size="13" text-anchor="middle">30 / 35 classes</text>
    <text x="655" y="240" fill="#6366f1" font-size="14" text-anchor="middle">CGPA (Provider)</text>
    <text x="655" y="270" fill="#fff" font-size="32" font-weight="bold" text-anchor="middle">3.75</text>
    <text x="655" y="330" fill="#94a3b8" font-size="12" text-anchor="middle">ChangeNotifier + notifyListeners()</text>
    <text x="655" y="350" fill="#94a3b8" font-size="12" text-anchor="middle">context.watch&lt;Provider&gt;()</text>
    <text x="655" y="380" fill="#94a3b8" font-size="11" text-anchor="middle">Decoupled, reactive state management</text>
  </g>
</svg>
