<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520">
  <rect width="900" height="520" fill="#0f172a"/>
  <rect x="40" y="35" width="820" height="450" rx="16" fill="#1e293b"/>
  <g font-family="Arial, sans-serif">
    <text x="450" y="75" fill="#10b981" font-size="16" font-weight="bold" text-anchor="middle">GPA Form Validator</text>
    <!-- Form fields -->
    <rect x="80" y="95" width="740" height="45" rx="8" fill="#243248" stroke="#334155" stroke-width="1"/>
    <text x="100" y="123" fill="#94a3b8" font-size="13">Course Name:</text>
    <text x="230" y="123" fill="#fff" font-size="13">Data Structures &amp; Algorithms</text>
    <rect x="80" y="155" width="740" height="45" rx="8" fill="#243248" stroke="#334155" stroke-width="1"/>
    <text x="100" y="183" fill="#94a3b8" font-size="13">Credit Hours:</text>
    <text x="230" y="183" fill="#fff" font-size="13">4</text>
    <text x="300" y="183" fill="#10b981" font-size="11">✓ Valid (1-6)</text>
    <rect x="80" y="215" width="740" height="45" rx="8" fill="#243248" stroke="#334155" stroke-width="1"/>
    <text x="100" y="243" fill="#94a3b8" font-size="13">Grade Earned:</text>
    <text x="230" y="243" fill="#fff" font-size="13">A (4.0)</text>
    <!-- Calculate Button -->
    <rect x="80" y="280" width="740" height="42" rx="10" fill="#10b981"/>
    <text x="450" y="306" fill="#000" font-size="14" font-weight="bold" text-anchor="middle">Validate &amp; Calculate</text>
    <!-- Result card -->
    <rect x="80" y="340" width="740" height="60" rx="10" fill="#243248" stroke="#10b981" stroke-width="1.5"/>
    <text x="100" y="375" fill="#fff" font-size="14">Data Structures → Grade A (4.0) × 4 Cr = 16.0 quality points</text>
    <!-- SnackBar -->
    <rect x="80" y="420" width="740" height="40" rx="8" fill="#10b981"/>
    <text x="450" y="445" fill="#000" font-size="13" font-weight="bold" text-anchor="middle">✓ Calculated: 16.0 quality points</text>
  </g>
</svg>
