<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520">
  <rect width="900" height="520" fill="#0f172a"/>
  <rect x="40" y="35" width="820" height="450" rx="16" fill="#1e293b"/>
  <g font-family="Arial, sans-serif">
    <text x="450" y="80" fill="#fff" font-size="18" font-weight="bold" text-anchor="middle">Student Companion</text>
    <text x="450" y="105" fill="#94a3b8" font-size="12" text-anchor="middle">FadeTransition → ScaleTransition → SlideTransition</text>
    <!-- Fade label -->
    <text x="450" y="145" fill="#10b981" font-size="12" text-anchor="middle">▼ FadeTransition (opacity: 0.0 → 1.0, Curves.easeIn)</text>
    <!-- CGPA Card (Scale) -->
    <rect x="200" y="165" width="500" height="110" rx="14" fill="#243248" stroke="#10b981" stroke-width="1.5"/>
    <text x="450" y="200" fill="#10b981" font-size="24" text-anchor="middle">⬤</text>
    <text x="450" y="225" fill="#94a3b8" font-size="13" text-anchor="middle">Current CGPA</text>
    <text x="450" y="260" fill="#10b981" font-size="32" font-weight="bold" text-anchor="middle">3.75</text>
    <text x="450" y="295" fill="#6366f1" font-size="12" text-anchor="middle">▼ ScaleTransition (Curves.elasticOut)</text>
    <!-- Attendance Card (Slide) -->
    <rect x="200" y="310" width="500" height="130" rx="14" fill="#243248" stroke="#6366f1" stroke-width="1.5"/>
    <text x="450" y="345" fill="#6366f1" font-size="24" text-anchor="middle">⬤</text>
    <text x="450" y="370" fill="#94a3b8" font-size="13" text-anchor="middle">Overall Attendance</text>
    <text x="450" y="405" fill="#6366f1" font-size="32" font-weight="bold" text-anchor="middle">88.8%</text>
    <text x="450" y="428" fill="#10b981" font-size="12" text-anchor="middle">Above 75% threshold ✓</text>
    <text x="450" y="460" fill="#f59e0b" font-size="12" text-anchor="middle">▼ SlideTransition (Offset(0,1) → Offset.zero, Curves.easeOutCubic)</text>
  </g>
</svg>
