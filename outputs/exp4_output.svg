<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520">
  <rect width="900" height="520" fill="#0f172a"/>
  <rect x="40" y="35" width="820" height="450" rx="16" fill="#1e293b"/>
  <g font-family="Arial, sans-serif">
    <text x="450" y="80" fill="#fff" font-size="18" font-weight="bold" text-anchor="middle">Named Route Navigation Map</text>
    <!-- Route boxes -->
    <rect x="310" y="100" width="280" height="60" rx="12" fill="#10b981"/>
    <text x="450" y="137" fill="#000" font-size="16" font-weight="bold" text-anchor="middle">/ (Dashboard Home)</text>
    <!-- Arrows -->
    <line x1="350" y1="160" x2="190" y2="210" stroke="#94a3b8" stroke-width="2"/>
    <line x1="450" y1="160" x2="450" y2="210" stroke="#94a3b8" stroke-width="2"/>
    <line x1="550" y1="160" x2="710" y2="210" stroke="#94a3b8" stroke-width="2"/>
    <!-- Route destinations -->
    <rect x="100" y="210" width="200" height="55" rx="10" fill="#6366f1"/>
    <text x="200" y="242" fill="#fff" font-size="14" font-weight="bold" text-anchor="middle">/courses</text>
    <rect x="350" y="210" width="200" height="55" rx="10" fill="#10b981"/>
    <text x="450" y="242" fill="#000" font-size="14" font-weight="bold" text-anchor="middle">/attendance</text>
    <rect x="600" y="210" width="200" height="55" rx="10" fill="#f59e0b"/>
    <text x="700" y="242" fill="#000" font-size="14" font-weight="bold" text-anchor="middle">/gpa</text>
    <!-- Screen previews -->
    <rect x="100" y="285" width="200" height="170" rx="10" fill="#243248" stroke="#6366f1" stroke-width="1"/>
    <text x="120" y="310" fill="#6366f1" font-size="12" font-weight="bold">Enrolled Courses</text>
    <text x="120" y="333" fill="#fff" font-size="11">CS301 - Data Structures</text>
    <text x="120" y="353" fill="#fff" font-size="11">CS302 - Mobile App Dev</text>
    <text x="120" y="373" fill="#fff" font-size="11">CS303 - Database Systems</text>
    <text x="120" y="393" fill="#fff" font-size="11">CS304 - Computer Networks</text>
    <text x="120" y="440" fill="#94a3b8" font-size="10">Navigator.pushNamed()</text>
    <rect x="350" y="285" width="200" height="170" rx="10" fill="#243248" stroke="#10b981" stroke-width="1"/>
    <text x="370" y="310" fill="#10b981" font-size="12" font-weight="bold">Attendance Tracker</text>
    <text x="370" y="340" fill="#fff" font-size="20" font-weight="bold">88.8%</text>
    <text x="370" y="365" fill="#10b981" font-size="11">Above 75% threshold ✓</text>
    <text x="370" y="440" fill="#94a3b8" font-size="10">Navigator.pop()</text>
    <rect x="600" y="285" width="200" height="170" rx="10" fill="#243248" stroke="#f59e0b" stroke-width="1"/>
    <text x="620" y="310" fill="#f59e0b" font-size="12" font-weight="bold">GPA Calculator</text>
    <text x="620" y="340" fill="#fff" font-size="20" font-weight="bold">SGPA: 3.75</text>
    <text x="620" y="365" fill="#94a3b8" font-size="11">Total Credits: 17 Cr</text>
    <text x="620" y="440" fill="#94a3b8" font-size="10">Navigator.pop()</text>
  </g>
</svg>
