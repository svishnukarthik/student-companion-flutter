<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520">
  <rect width="900" height="520" fill="#0f172a"/>
  <rect x="40" y="35" width="820" height="450" rx="16" fill="#1e293b"/>
  <g font-family="Arial, sans-serif">
    <text x="450" y="72" fill="#10b981" font-size="16" font-weight="bold" text-anchor="middle">Daily Study Motivation (REST API)</text>
    <text x="450" y="95" fill="#94a3b8" font-size="11" text-anchor="middle">HTTP GET → JSON Deserialization → FutureBuilder</text>
    <!-- API Flow Diagram -->
    <rect x="80" y="115" width="180" height="40" rx="8" fill="#6366f1"/>
    <text x="170" y="140" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">Flutter App</text>
    <line x1="260" y1="135" x2="340" y2="135" stroke="#94a3b8" stroke-width="2"/>
    <text x="300" y="125" fill="#94a3b8" font-size="10" text-anchor="middle">HTTP GET</text>
    <rect x="340" y="115" width="220" height="40" rx="8" fill="#f59e0b"/>
    <text x="450" y="140" fill="#000" font-size="12" font-weight="bold" text-anchor="middle">zenquotes.io/api/today</text>
    <line x1="560" y1="135" x2="640" y2="135" stroke="#94a3b8" stroke-width="2"/>
    <text x="600" y="125" fill="#94a3b8" font-size="10" text-anchor="middle">JSON</text>
    <rect x="640" y="115" width="180" height="40" rx="8" fill="#10b981"/>
    <text x="730" y="140" fill="#000" font-size="12" font-weight="bold" text-anchor="middle">FutureBuilder</text>
    <!-- Quote Card -->
    <defs>
      <linearGradient id="quoteGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#1e293b"/>
        <stop offset="100%" stop-color="#312e81"/>
      </linearGradient>
    </defs>
    <rect x="100" y="185" width="700" height="200" rx="14" fill="url(#quoteGrad)" stroke="#6366f1" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="130" y="225" fill="#10b981" font-size="24">❝</text>
    <text x="450" y="260" fill="#fff" font-size="16" font-style="italic" text-anchor="middle">"Success is the sum of small efforts,</text>
    <text x="450" y="285" fill="#fff" font-size="16" font-style="italic" text-anchor="middle">repeated day in and day out."</text>
    <text x="670" y="340" fill="#10b981" font-size="14" font-weight="bold" text-anchor="end">— Robert Collier</text>
    <!-- Loading/Error states -->
    <text x="450" y="425" fill="#94a3b8" font-size="13" text-anchor="middle">States: Loading Spinner → Success (Quote Card) → Error (Retry Button)</text>
    <text x="450" y="450" fill="#94a3b8" font-size="11" text-anchor="middle">Graceful offline fallback with hardcoded academic motivation</text>
  </g>
</svg>
